name: Diagnose ExHentai layout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EH_COOKIE: ${{ secrets.EH_COOKIE }}

    steps:
      - name: Diagnose gallery layout
        run: |
          set -euo pipefail

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36'

          curl -L -sS \
            -A "$UA" \
            --cookie "$EH_COOKIE" \
            --cookie-jar /tmp/exh.cookies \
            -o /dev/null \
            'https://exhentai.org/?inline_set=dm_e'

          http_code="$(curl -L -sS --compressed \
            -A "$UA" \
            --cookie "$EH_COOKIE" \
            --cookie-jar /tmp/exh.cookies \
            -o /tmp/exh.html \
            -w '%{http_code}' \
            'https://exhentai.org/')"

          echo "second request HTTP: $http_code"
          echo "second request bytes: $(wc -c </tmp/exh.html)"

          python3 - <<'PY'
          from pathlib import Path
          import re
          from html import unescape

          html = Path('/tmp/exh.html').read_text(
              encoding='utf-8',
              errors='ignore',
          )
          lower = html.lower()

          def first(pattern, flags=re.I | re.S):
              m = re.search(pattern, html, flags)
              return unescape(m.group(1)).strip() if m else '(none)'

          print('title:', first(r'<title[^>]*>(.*?)</title>'))
          print('html bytes:', len(html.encode('utf-8')))

          classes = sorted(set(re.findall(
              r'<(?:table|div)[^>]*class=["\']([^"\']+)["\']',
              html,
              flags=re.I,
          )))
          print('table/div classes:')
          for item in classes[:40]:
              print(' ', item)

          absolute_links = len(re.findall(
              r'https?://(?:www\.)?exhentai\.org/g/\d+/[0-9a-f]+',
              html,
              flags=re.I,
          ))
          relative_links = len(re.findall(
              r'["\']/g/\d+/[0-9a-f]+',
              html,
              flags=re.I,
          ))

          print('absolute gallery links:', absolute_links)
          print('relative gallery links:', relative_links)
          print('contains glte:', 'glte' in lower)
          print('contains gltc:', 'gltc' in lower)
          print('contains gltm:', 'gltm' in lower)
          print('contains sad panda:', 'sad panda' in lower)
          print('contains login:', 'login' in lower)

          text_only = re.sub(r'<script.*?</script>|<style.*?</style>', ' ', html, flags=re.I | re.S)
          text_only = re.sub(r'<[^>]+>', ' ', text_only)
          text_only = re.sub(r'\s+', ' ', unescape(text_only)).strip()
          print('page text preview:', text_only[:500])
          PY
